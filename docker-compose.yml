# version: '3.8'
# Version 3.8 is still the current latest verion of the docker-compose file format, but it is no longer required to specify it.
services:
  n8n:
    image: n8nio/n8n:2.18.0
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    environment:
      - N8N_HOST=localhost
      - WEBHOOK_URL=http://localhost:5678/
    restart: always

volumes:
  n8n_data:
